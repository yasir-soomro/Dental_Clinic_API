[project]
name = "dental-clinic"
version = "0.1.0"
description = "FastAPI backend for dental clinic appointments and user accounts"
readme = "README.md"
authors = [
    { name = "Yasir Soomro", email = "your-email@example.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "email-validator>=2.3.0",
    "fastapi>=0.158.1",
    "pwdlib[argon2]>=0.3.1",
    "python-dotenv>=1.1.1",
    "pydantic-settings>=2.16.1",
    "pydantic[email]>=2.14.1",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
dental-clinic = "dental_clinic.cli:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
